<rect x='40' y='40' width='560' height='300' rx='6' fill='#f3f3f3' stroke='#bbb' stroke-width='1.5'/><rect x='40' y='40' width='560' height='34' rx='6' fill='#e4e4e4'/><text x='58' y='62' font-size='14' fill='#222' font-weight='600' text-anchor='start'>loopMIDI</text><text x='60' y='100' font-size='13' fill='#222' font-weight='700' text-anchor='start'>Setup</text><text x='115' y='100' font-size='13' fill='#555' font-weight='400' text-anchor='start'>Advanced</text><text x='190' y='100' font-size='13' fill='#555' font-weight='400' text-anchor='start'>About</text><rect x='60' y='115' width='520' height='150' rx='2' fill='#fff' stroke='#bbb' stroke-width='1.5'/><rect x='60' y='115' width='520' height='26' fill='#eaeaea'/><text x='70' y='133' font-size='12' fill='#333' font-weight='600' text-anchor='start'>Name</text><text x='330' y='133' font-size='12' fill='#333' font-weight='600' text-anchor='start'>Total data</text><rect x='61' y='142' width='518' height='26' fill='#cfe3ff'/><text x='70' y='160' font-size='13' fill='#111' font-weight='700' text-anchor='start'>APC VIRT A</text><rect x='61' y='168' width='518' height='26' fill='#cfe3ff'/><text x='70' y='186' font-size='13' fill='#111' font-weight='700' text-anchor='start'>APC VIRT B</text><rect x='60' y='285' width='26' height='26' rx='3' fill='#fff' stroke='#888' stroke-width='1.5'/><text x='73' y='304' font-size='18' fill='#111' font-weight='700' text-anchor='middle'>+</text><text x='100' y='303' font-size='12' fill='#333' font-weight='400' text-anchor='start'>New port-name:</text><rect x='200' y='287' width='380' height='24' rx='2' fill='#fff' stroke='#888' stroke-width='1.5'/><text x='208' y='304' font-size='13' fill='#111' font-weight='400' text-anchor='start'>APC VIRT B</text><circle cx='73' cy='298' r='20' fill='none' stroke='#ff4d4d' stroke-width='3'/><text x='640' y='90' font-size='15' fill='#e8e8ea' font-weight='600' text-anchor='start'>1. In “New port-name”, enter</text><text x='640' y='112' font-size='15' fill='#ffd34d' font-weight='700' text-anchor='start'>   APC VIRT A and click +</text><text x='640' y='150' font-size='15' fill='#e8e8ea' font-weight='600' text-anchor='start'>2. Repeat for</text><text x='640' y='172' font-size='15' fill='#ffd34d' font-weight='700' text-anchor='start'>   APC VIRT B</text><text x='640' y='215' font-size='15' fill='#e8e8ea' font-weight='600' text-anchor='start'>3. Enable loopMIDI autostart</text><text x='640' y='237' font-size='15' fill='#e8e8ea' font-weight='600' text-anchor='start'>   when Windows starts</text><text x='640' y='262' font-size='13' fill='#9aa3b2' font-weight='400' text-anchor='start'>   (right-click the tray icon</text><text x='640' y='280' font-size='13' fill='#9aa3b2' font-weight='400' text-anchor='start'>   → Autostart)</text><text x='640' y='320' font-size='13' fill='#ff9a9a' font-weight='400' text-anchor='start'>Names must match config.json exactly.</text>
