<text x='40' y='50' font-size='17' fill='#fff' font-weight='700' text-anchor='start'>Resolume Arena → Shortcuts → Edit MIDI</text><rect x='40' y='75' width='430' height='260' rx='8' fill='#24262c' stroke='#3a3d46' stroke-width='1.5'/><text x='60' y='105' font-size='14' fill='#9aa3b2' font-weight='600' text-anchor='start'>Shortcuts</text><rect x='60' y='120' width='390' height='34' rx='4' fill='#2d3038' stroke='#4d9dff' stroke-width='1.5'/><text x='72' y='142' font-size='14' fill='#fff' font-weight='700' text-anchor='start'>APC40 BRIDGE EXAMPLE</text><text x='66' y='185' font-size='12' fill='#cfd3dc' font-weight='400' text-anchor='start'>Composition Layers 1 Clips 1 Connect   1:C-1</text><text x='66' y='211' font-size='12' fill='#cfd3dc' font-weight='400' text-anchor='start'>Composition Layers 1 Video Opacity      1:CC7</text><text x='66' y='237' font-size='12' fill='#cfd3dc' font-weight='400' text-anchor='start'>Composition Tempocontroller Tempotap  1:D#7</text><text x='66' y='263' font-size='12' fill='#cfd3dc' font-weight='400' text-anchor='start'>…</text><text x='510' y='110' font-size='15' fill='#e8e8ea' font-weight='600' text-anchor='start'>1. Vyber preset nastavený na</text><text x='510' y='132' font-size='15' fill='#ffd34d' font-weight='700' text-anchor='start'>   „libovolné zařízení“</text><text x='510' y='170' font-size='14' fill='#b8bcc6' font-weight='400' text-anchor='start'>   ukázkový: APC40 BRIDGE EXAMPLE</text><text x='510' y='210' font-size='15' fill='#e8e8ea' font-weight='600' text-anchor='start'>2. Vlastní preset vázaný na</text><text x='510' y='232' font-size='15' fill='#ff9a9a' font-weight='600' text-anchor='start'>   „APC40 mkII“ přes bridge nereaguje</text><text x='510' y='256' font-size='13' fill='#b8bcc6' font-weight='400' text-anchor='start'>   → shortcuty přeuč (učí se z VIRT A),</text><text x='510' y='276' font-size='13' fill='#b8bcc6' font-weight='400' text-anchor='start'>   nebo vyjdi z ukázkového presetu.</text><text x='510' y='316' font-size='15' fill='#e8e8ea' font-weight='600' text-anchor='start'>3. Ulož kompozici – preset se pamatuje v ní.</text>
