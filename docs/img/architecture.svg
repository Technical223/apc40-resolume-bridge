hor='middle'>APC VIRT A</text><rect x='650' y='150' width='170' height='70' rx='8' fill='#2a2440' stroke='#a07bff' stroke-width='1.5'/><text x='735' y='180' font-size='14' fill='#fff' font-weight='700' text-anchor='middle'>loopMIDI</text><text x='735' y='202' font-size='14' fill='#d9ccff' font-weight='600' text-anchor='middle'>APC VIRT B</text><rect x='900' y='70' width='190' height='120' rx='8' fill='#232530' stroke='#3a3d46' stroke-width='1.5'/><text x='995' y='112' font-size='16' fill='#fff' font-weight='700' text-anchor='middle'>Resolume Arena</text><text x='995' y='136' font-size='12' fill='#9aa3b2' font-weight='400' text-anchor='middle'>MIDI input: VIRT A</text><text x='995' y='156' font-size='12' fill='#9aa3b2' font-weight='400' text-anchor='middle'>MIDI output: VIRT B</text><line x1='210' y1='110' x2='296' y2='110' stroke='#9aa3b2' stroke-width='2.5' marker-end='url(#ah)'/><text x='253' y='60' font-size='12' fill='#b8bcc6' font-weight='400' text-anchor='middle'>knobs, pads,</text><text x='253' y='76' font-size='12' fill='#b8bcc6' font-weight='400' text-anchor='middle'>faders →</text><line x1='296' y1='160' x2='214' y2='160' stroke='#9aa3b2' stroke-width='2.5' marker-end='url(#ah)'/><text x='255.0' y='180' font-size='12' fill='#b8bcc6' font-weight='400' text-anchor='middle'>LED</text><line x1='560' y1='90' x2='646' y2='78' stroke='#9aa3b2' stroke-width='2.5' marker-end='url(#ah)'/><line x1='820' y1='78' x2='896' y2='100' stroke='#9aa3b2' stroke-width='2.5' marker-end='url(#ah)'/><text x='858.0' y='70' font-size='12' fill='#b8bcc6' font-weight='400' text-anchor='middle'>controls</text><line x1='896' y1='165' x2='824' y2='185' stroke='#9aa3b2' stroke-width='2.5' marker-end='url(#ah)'/><text x='862' y='214' font-size='12' fill='#b8bcc6' font-weight='400' text-anchor='middle'>LED feedback</text><line x1='646' y1='190' x2='564' y2='170' stroke='#9aa3b2' stroke-width='2.5' marker-end='url(#ah)'/><text x='560' y='250' font-size='14' fill='#b8bcc6' font-weight='400' 