name: Windows application
on:
  workflow_dispatch:
  pull_request:
    paths: ["bridge/**", "tests/**", ".github/workflows/windows.yml"]
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install mido python-rtmidi
      - name: Run regression and management tests
        run: python -m unittest discover -s tests -v
      - name: Test safe process stop
        run: python tests/test_stop_process.py
      - name: Build Windows package
        shell: powershell
        run: ./bridge/package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: APC40-Bridge-Windows
          path: dist/APC40-Bridge-Windows.zip
