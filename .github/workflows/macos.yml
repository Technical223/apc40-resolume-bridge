name: macOS preview
on:
  workflow_dispatch:
  pull_request:
    paths: ["macos/**", "bridge/apc_bridge.py", "bridge/config.json", "tests/**", ".github/workflows/macos.yml"]
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned MIDI wheels
        run: |
          python -m pip install --only-binary=:all: -r macos/requirements.txt
      - name: Portable regression tests
        run: python -m unittest discover -s tests -v
      - name: Native CoreMIDI and diagnostics checks
        timeout-minutes: 2
        run: python macos/smoke_macos.py
      - name: Package unsigned tester app
        run: python macos/package_macos.py
      - name: Verify executable permissions after unzip
        run: |
          unzip -q dist/APC40-Bridge-macOS-Preview.zip -d preview-check
          test -x "preview-check/APC40-Bridge-macOS-Preview/APC40 Bridge macOS Preview.app/Contents/MacOS/launcher"
          plutil -lint "preview-check/APC40-Bridge-macOS-Preview/APC40 Bridge macOS Preview.app/Contents/Info.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: APC40-Bridge-macOS-Preview
          path: dist/APC40-Bridge-macOS-Preview.zip
