name: Bug report (Windows)
description: Something in Bridge, Controller Studio or the visualizer does not work as expected.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do not attach compositions, show media or private room models.
        Logs may contain MIDI device names; review them before attaching.
  - type: input
    id: versions
    attributes:
      label: Bridge, Windows and Arena versions
      placeholder: Bridge 1.5.0, Windows 11 24H2, Arena 7.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do, what happened, what did you expect?
      description: Steps, the exact error message and roughly when it happened.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Copy relevant lines from the Logs page of the dashboard.
      render: text
